kind = "web"
previewPath = "/workforce/"
title = "Workforce Compliance"
version = "1.0.0"
id = "artifacts/workforce"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/workforce/" ]
localPort = 21728

[services.development]
run = "pnpm --filter @workspace/workforce run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workforce", "run", "build" ]
publicDir = "artifacts/workforce/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21728"
BASE_PATH = "/workforce/"
