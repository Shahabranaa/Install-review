        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        address:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - projectId
        - name
        - createdAt
        - updatedAt

    CreateSiteBody:
