      operationId: startDprLautecImport
      tags: [dpr]
      summary: Start one validated manual Lautec browser import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LautecImportInput"
      responses:
        "202":
          description: Import browser run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LautecImportRun"
        "409":
          description: Duplicate source snapshot or run already in progress
        "422":
          description: Capture tab validation failed
        "503":
          description: Lautec browser configuration is unavailable

