      tags: [dpr]
      summary: List Lautec import attempts for one DPR date and team
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: teamId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import attempts
          content:
